services:
  neo4j:
    profiles:
      - 'dev'
    image: 'neo4j:5.26.17-community'
    restart: unless-stopped
    ports:
      - '7474:7474'
      - '7687:7687'
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
#      test: ["CMD-SHELL", "cypher-shell -u $NEO4J_USERNAME -p $NEO4J_PASSWORD 'RETURN 1'"]
      test: ["CMD-SHELL", "echo $PATH"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  minio:
    profiles:
      - 'dev'
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '9000:9000'
      - '9001:9001'
  files-api:
    profiles:
      - 'dev'
    build:
      context: ./src/file_service
      dockerfile: Dockerfile
    env_file:
      - .env.dev
    ports:
      - "8000:8000"
    depends_on:
      - minio
  ai-service:
    profiles:
      - 'dev'
    build:
      context: ./src/ai_service
      dockerfile: Dockerfile
    env_file:
      - .env.dev
    ports:
      - "8001:8000"
    depends_on:
      files-api:
        condition: service_started
      neo4j:
        condition: service_healthy
